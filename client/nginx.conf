server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SpacetimeDB lives under /v1 — proxy it (WebSocket included) to the
    # spacetimedb container so the game runs same-origin on ONE domain.
    # The upstream is resolved at REQUEST time via Docker's embedded DNS
    # (a variable proxy_pass defers resolution), so nginx starts fine even
    # if the spacetimedb container comes up later.
    location /v1 {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stdb_upstream http://spacetimedb:3000;
        proxy_pass $stdb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # The update check polls this — it must never be served from a cache,
    # or stale clients would keep being told they're current.
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
